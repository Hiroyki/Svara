<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Svara</title>
    <!-- Shown while the bundled server boots; mirrors the in-app launch animation (components/Intro.tsx). -->
    <style>
      html, body { margin: 0; height: 100%; background: #0c0c0d; overflow: hidden; }
      body { display: grid; place-items: center; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
      .drag { position: fixed; inset: 0 0 auto 0; height: 36px; -webkit-app-region: drag; }
      .wrap { display: flex; flex-direction: column; align-items: center; }
      svg { width: 96px; height: 96px; animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .bar { transform-box: fill-box; transform-origin: center; transform: scaleY(0);
             animation: grow 0.9s ease-in-out both; animation-delay: calc(0.18s + var(--d) * 0.045s); }
      .word { margin-top: 20px; display: flex; overflow: hidden; color: #f4f4f5; font-weight: 800; font-size: 26px; letter-spacing: 0.12em; }
      .word span { display: inline-block; transform: translateY(110%); animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .track { margin-top: 16px; width: 112px; height: 3px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
      .fill { height: 100%; width: 40%; border-radius: 99px; background: #3ddc6b; animation: load 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.4s infinite; transform: translateX(-100%); }
      @keyframes pop { from { transform: scale(0.4) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes grow { 0% { transform: scaleY(0); } 45% { transform: scaleY(1); } 72% { transform: scaleY(0.55); } 100% { transform: scaleY(1); } }
      @keyframes rise { to { transform: none; } }
      @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="drag"></div>
    <div class="wrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <rect width="120" height="120" rx="22" fill="#3ddc6b" />
        <g fill="#fff">
          <rect class="bar" style="--d: 5" x="16" y="50" width="4.5" height="20" rx="2.25" />
          <rect class="bar" style="--d: 4" x="24" y="44" width="4.5" height="32" rx="2.25" />
          <rect class="bar" style="--d: 3" x="32" y="37" width="4.5" height="46" rx="2.25" />
          <rect class="bar" style="--d: 2" x="40" y="30" width="4.5" height="60" rx="2.25" />
          <rect class="bar" style="--d: 1" x="48" y="22" width="4.5" height="76" rx="2.25" />
          <rect class="bar" style="--d: 0" x="56" y="14" width="4.5" height="92" rx="2.25" />
          <rect class="bar" style="--d: 1" x="64" y="22" width="4.5" height="76" rx="2.25" />
          <rect class="bar" style="--d: 2" x="72" y="30" width="4.5" height="60" rx="2.25" />
          <rect class="bar" style="--d: 3" x="80" y="37" width="4.5" height="46" rx="2.25" />
          <rect class="bar" style="--d: 4" x="88" y="44" width="4.5" height="32" rx="2.25" />
          <rect class="bar" style="--d: 5" x="96" y="50" width="4.5" height="20" rx="2.25" />
        </g>
      </svg>
      <div class="word">
        <span style="animation-delay: 0.55s">S</span><span style="animation-delay: 0.61s">V</span><span style="animation-delay: 0.67s">A</span><span style="animation-delay: 0.73s">R</span><span style="animation-delay: 0.79s">A</span>
      </div>
      <div class="track"><div class="fill"></div></div>
    </div>
  </body>
</html>
